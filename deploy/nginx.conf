# /etc/nginx/sites-available/kinetra
# TLS is added by: certbot --nginx -d kinetraagent.tech -d www.kinetraagent.tech

limit_req_zone $binary_remote_addr zone=kinetra_chain:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name kinetraagent.tech www.kinetraagent.tech;

    root /var/www/kinetra;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Same-origin chain access for visitors whose ISP blocks the Robinhood Chain hosts by DNS
    location = /rpc {
        limit_except POST { deny all; }
        limit_req zone=kinetra_chain burst=30 nodelay;
        client_max_body_size 32k;
        proxy_pass https://rpc.testnet.chain.robinhood.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host rpc.testnet.chain.robinhood.com;
    }

    location /explorer-api/ {
        limit_except GET { deny all; }
        limit_req zone=kinetra_chain burst=10 nodelay;
        proxy_pass https://explorer.testnet.chain.robinhood.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host explorer.testnet.chain.robinhood.com;
        proxy_cache_valid 200 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
