# Site container config, mounted at /etc/nginx/conf.d/default.conf.
# testnet.kinetraagent.tech serves the testnet build. kinetraagent.tech mirrors it until mainnet
# launches, so installers and onchain tool manifests that point at the apex keep working.
# The VPS's Traefik terminates TLS and forwards here (deploy/traefik.yaml).

# rate limits key on the visitor, not on Traefik
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=kinetra_chain:10m rate=10r/s;

# Robinhood Chain Testnet
server {
    listen 80 default_server;
    # shortcut: the apex rides on testnet until mainnet; at launch drop it here and enable the block below
    server_name testnet.kinetraagent.tech kinetraagent.tech www.kinetraagent.tech;

    root /usr/share/nginx/testnet;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Same-origin chain access for visitors whose ISP blocks the Robinhood Chain hosts by DNS
    location = /rpc {
        limit_except POST { deny all; }
        limit_req zone=kinetra_chain burst=30 nodelay;
        client_max_body_size 32k;
        proxy_pass https://rpc.testnet.chain.robinhood.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host rpc.testnet.chain.robinhood.com;
    }

    location /explorer-api/ {
        limit_except GET { deny all; }
        limit_req zone=kinetra_chain burst=10 nodelay;
        proxy_pass https://explorer.testnet.chain.robinhood.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host explorer.testnet.chain.robinhood.com;
        proxy_cache_valid 200 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

